name: Build KrezzWafa APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'app/**', '*.gradle', 'settings.gradle', '.github/workflows/build-apk.yml' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download supplied KrezzWafa logo
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl -L --fail --retry 3 'https://images.glints.com/unsafe/glints-dashboard.oss-ap-southeast-1.aliyuncs.com/company-logo/78a41de8188ede602ae03af9609dccb4.jpeg' -o app/src/main/res/drawable-nodpi/krezz_logo.jpg
      - name: Build installable APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KrezzWafa-Sales.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KrezzWafa-Sales-APK
          path: KrezzWafa-Sales.apk
          retention-days: 30
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: KrezzWafa Sales Android v1.0.0 (Build ${{ github.run_number }})
          prerelease: true
          generate_release_notes: true
          files: KrezzWafa-Sales.apk
