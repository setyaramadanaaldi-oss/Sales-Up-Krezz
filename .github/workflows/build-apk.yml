name: Build KrezzWafa APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare KrezzWafa logo and app icons
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          curl -L --fail --retry 3 \
            'https://images.glints.com/unsafe/glints-dashboard.oss-ap-southeast-1.aliyuncs.com/company-logo/78a41de8188ede602ae03af9609dccb4.jpeg' \
            -o app/src/main/res/drawable-nodpi/krezz_logo.jpg
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          src = Image.open('app/src/main/res/drawable-nodpi/krezz_logo.jpg').convert('RGB')
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density, size in sizes.items():
              canvas = Image.new('RGB',(size,size),(229,9,20))
              img = src.copy()
              img.thumbnail((size-4,size-4))
              canvas.paste(img,((size-img.width)//2,(size-img.height)//2))
              canvas.save(f'app/src/main/res/mipmap-{density}/ic_launcher.png')
          PY

      - name: Build installable APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KrezzWafa-Sales.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KrezzWafa-Sales-APK
          path: KrezzWafa-Sales.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: KrezzWafa Sales Android v1.0.0 (Build ${{ github.run_number }})
          prerelease: true
          generate_release_notes: true
          files: KrezzWafa-Sales.apk
