name: Build Aldi Life APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'aldi-life-android/**'
      - '.github/workflows/build-aldi-life.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p aldi-life-android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Aldi-Life-APK
          path: aldi-life-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
